<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Word Magic</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Nunito:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: manipulation;
        }
        
        /* 隐藏未编译的 Vue 模板，防止闪烁 */
        [v-cloak] { display: none !important; }

        /* 魔法卡片样式 */
        .magic-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
            transition: transform 0.2s;
        }
        
        /* 游戏按钮 */
        .game-btn {
            background: white;
            border: 3px solid #e0e0e0;
            border-radius: 20px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.2rem;
            color: #555;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 0 #dcdcdc;
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }
        .game-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #dcdcdc;
        }
        .game-btn.selected {
            background: #FFD166;
            border-color: #FFA500;
            color: #fff;
            text-shadow: 1px 1px 0 #d48800;
            box-shadow: 0 4px 0 #d48800;
        }
        .game-btn.correct {
            background: #06D6A0;
            border-color: #04966F;
            color: white;
            box-shadow: 0 4px 0 #04966F;
            animation: pulse 0.5s;
        }
        .game-btn.wrong {
            background: #EF476F;
            border-color: #B91C43;
            color: white;
            box-shadow: 0 4px 0 #B91C43;
            animation: shakeX 0.5s;
        }
        /* 禁用状态 */
        .game-btn.invisible {
            visibility: hidden;
        }

        /* 进度条 */
        .progress-bar-container {
            background: rgba(255,255,255,0.5);
            border-radius: 99px;
            height: 20px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #FF9A9E 0%, #FECFEF 100%);
            height: 100%;
            transition: width 0.5s ease;
        }

        /* 首页大按钮 */
        .hero-btn {
            background: linear-gradient(to bottom, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 8px 0 #2c8bc2, 0 15px 20px rgba(0,0,0,0.2);
            color: white;
            text-shadow: 2px 2px 0 rgba(0,0,0,0.1);
            border-radius: 30px;
            transition: all 0.2s;
            cursor: pointer;
        }
        .hero-btn:active {
            transform: translateY(8px);
            box-shadow: 0 0 0 #2c8bc2, 0 0 0 rgba(0,0,0,0);
        }

        /* 拼写输入框 */
        .spell-input {
            border: 4px solid #A18CD1;
            border-radius: 15px;
            font-family: 'Fredoka', sans-serif;
            letter-spacing: 2px;
            color: #4A4A4A;
        }
        .spell-input:focus {
            outline: none;
            border-color: #FF9A9E;
            box-shadow: 0 0 0 4px rgba(255, 154, 158, 0.3);
        }
    </style>
</head>
<body>

<div id="app" v-cloak class="max-w-2xl mx-auto p-4 min-h-screen flex flex-col">
    
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-black text-white drop-shadow-md" style="font-family: 'Fredoka'">Word Magic 🏰</h1>
        <div v-if="page !== 'home'" @click="goHome" class="bg-white p-2 rounded-full shadow-lg cursor-pointer hover:bg-gray-50 active:scale-95 transition">
            🏠
        </div>
    </div>

    <div v-if="page === 'home'" class="flex-1 flex flex-col justify-center animate__animated animate__fadeIn">
        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="magic-card p-6 text-center">
                <div class="text-4xl mb-2">📚</div>
                <div class="text-3xl font-bold text-gray-700">{{ stats.total }}</div>
                <div class="text-gray-500 text-sm font-bold">Total Words</div>
            </div>
            <div class="magic-card p-6 text-center">
                <div class="text-4xl mb-2">🌱</div>
                <div class="text-3xl font-bold text-gray-700">{{ stats.new_words }}</div>
                <div class="text-gray-500 text-sm font-bold">New Words</div>
            </div>
        </div>

        <button @click="startLearning" class="hero-btn w-full py-6 text-2xl font-black mb-6 flex items-center justify-center gap-3">
            <span>🚀</span> START LEARNING
        </button>
        
        <button class="bg-white text-gray-400 border-4 border-gray-200 rounded-3xl py-4 font-bold text-xl shadow-sm cursor-not-allowed">
            🧠 Review (Coming Soon)
        </button>
    </div>

    <div v-if="page === 'matching'" class="flex-1 flex flex-col animate__animated animate__fadeIn">
        <h2 class="text-center text-white text-xl font-bold mb-4 drop-shadow">Match the Cards! 🧩</h2>
        
        <div class="progress-bar-container mb-6 w-full">
            <div class="progress-fill" :style="{width: progressPercent + '%'}"></div>
        </div>

        <div class="grid grid-cols-2 gap-4 flex-1 content-start">
            <div class="flex flex-col gap-3">
                <div v-for="w in matchBatch" :key="'word-'+w.id" 
                     @click="selectWord(w.id)"
                     class="game-btn h-20 flex items-center justify-center text-xl font-bold"
                     :class="{
                        'selected': selectedWordId === w.id,
                        'correct': matchedIds.includes(w.id),
                        'invisible': matchedIds.includes(w.id) && !showSuccessAnim
                     }">
                    {{ w.word }}
                </div>
            </div>
            
            <div class="flex flex-col gap-3">
                <div v-for="w in matchBatchShuffled" :key="'def-'+w.id"
                     @click="checkMatch(w.id)"
                     class="game-btn h-20 flex items-center justify-center px-2 text-sm leading-tight font-bold"
                     :class="{
                        'correct': matchedIds.includes(w.id),
                        'invisible': matchedIds.includes(w.id) && !showSuccessAnim
                     }">
                    {{ w.definition }}
                </div>
            </div>
        </div>
    </div>

    <div v-if="page === 'spelling'" class="flex-1 flex flex-col items-center justify-center animate__animated animate__zoomIn">
        
        <div class="w-full text-center text-white font-bold opacity-80 mb-4">
            Words Left: {{ remainingWords.length }}
        </div>

        <div class="magic-card w-full p-8 text-center mb-6 relative">
            <div class="text-5xl mb-4">💡</div>
            <div class="text-2xl font-bold text-gray-700 leading-tight">
                {{ currentWord ? currentWord.definition : '' }}
            </div>
            <div class="mt-6 bg-yellow-100 text-yellow-600 font-mono text-3xl py-3 rounded-xl tracking-widest font-bold border-2 border-dashed border-yellow-300">
                {{ currentHint }}
            </div>
        </div>

        <input ref="spellInput" 
               v-model="userSpelling" 
               @keyup.enter="submitSpelling"
               type="text" 
               class="spell-input w-full p-4 text-center text-3xl shadow-lg mb-6"
               placeholder="Type here..." 
               autocapitalize="off" autocomplete="off" autocorrect="off">

        <button @click="submitSpelling" 
                class="hero-btn w-full py-4 text-xl font-bold rounded-2xl shadow-lg"
                style="background: linear-gradient(to right, #43e97b 0%, #38f9d7 100%); box-shadow: 0 6px 0 #2a9d8f;">
            ✨ CHECK ✨
        </button>

        <button v-if="spellingAttempt > 0" @click="nextSpellingWord" class="mt-4 text-white font-bold underline opacity-80">
            I don't know, skip ➡️
        </button>
    </div>

    <div v-if="page === 'finished'" class="flex-1 flex flex-col items-center justify-center text-center animate__animated animate__tada">
        <div class="text-8xl mb-6">🏆</div>
        <h2 class="text-4xl font-black text-white drop-shadow-md mb-4">AMAZING!</h2>
        <p class="text-xl text-white font-bold mb-8">You learned 20 new words today!</p>
        <button @click="goHome" class="hero-btn px-12 py-4 text-xl font-bold">Play Again</button>
    </div>

</div>

<script>
    const { createApp } = Vue

    const app = createApp({
        data() {
            return {
                page: 'home',
                stats: { total: 0, new_words: 0 },
                queue: [],
                progressMap: {},
                
                // 配对状态
                matchBatch: [],
                matchBatchShuffled: [],
                selectedWordId: null,
                matchedIds: [],
                showSuccessAnim: false,

                // 拼写状态
                currentWord: null,
                currentHint: '',
                userSpelling: '',
                spellingAttempt: 0
            }
        },
        computed: {
            progressPercent() {
                if(this.queue.length === 0) return 0;
                const done = this.queue.filter(w => this.progressMap[w.id] >= 1).length;
                return (done / this.queue.length) * 100;
            },
            remainingWords() {
                return this.queue.filter(w => this.progressMap[w.id] < 2);
            }
        },
        mounted() {
            this.fetchStats();
        },
        methods: {
            async fetchStats() {
                try {
                    const res = await fetch('/api/stats');
                    this.stats = await res.json();
                } catch(e) {
                    console.error("API Error:", e);
                }
            },
            async startLearning() {
                const res = await fetch('/api/new_words');
                const words = await res.json();
                
                if(words.length === 0) {
                    alert("No new words! Tell Dad to upload more!");
                    return;
                }

                this.queue = words;
                this.progressMap = {};
                words.forEach(w => this.progressMap[w.id] = 0);
                
                this.startMatchingPhase();
            },
            goHome() {
                this.page = 'home';
                this.fetchStats();
            },

            // --- 配对逻辑 ---
            startMatchingPhase() {
                this.page = 'matching';
                this.refillMatchBatch();
            },
            refillMatchBatch() {
                const needMatch = this.queue.filter(w => this.progressMap[w.id] < 1);
                
                if(needMatch.length === 0) {
                    this.startSpellingPhase();
                    return;
                }

                this.matchBatch = this.matchBatch.filter(w => this.progressMap[w.id] < 1);

                while(this.matchBatch.length < 4) {
                    const candidates = needMatch.filter(w => !this.matchBatch.find(b => b.id === w.id));
                    if(candidates.length === 0) break;
                    const randomWord = candidates[Math.floor(Math.random() * candidates.length)];
                    this.matchBatch.push(randomWord);
                }

                this.matchBatchShuffled = [...this.matchBatch].sort(() => Math.random() - 0.5);
                this.matchedIds = [];
            },
            selectWord(id) {
                if(this.matchedIds.includes(id)) return;
                this.selectedWordId = (this.selectedWordId === id) ? null : id;
            },
            checkMatch(defId) {
                if(!this.selectedWordId) return;

                if(this.selectedWordId === defId) {
                    // Correct
                    this.matchedIds.push(defId);
                    this.progressMap[defId]++;
                    this.selectedWordId = null;
                    
                    this.showSuccessAnim = true;
                    setTimeout(() => {
                        this.showSuccessAnim = false;
                        this.refillMatchBatch();
                    }, 500);

                } else {
                    // Wrong
                    // 简单的震动反馈逻辑通常需要CSS配合，这里直接重置状态
                    this.progressMap[this.selectedWordId] = 0;
                    this.progressMap[defId] = 0;
                    this.selectedWordId = null;
                    // 可以加一个 alert 或者 UI 提示，这里保持简洁
                }
            },

            // --- 拼写逻辑 ---
            startSpellingPhase() {
                this.page = 'spelling';
                this.nextSpellingWord();
            },
            nextSpellingWord() {
                const remaining = this.queue.filter(w => this.progressMap[w.id] < 2);
                if(remaining.length === 0) {
                    this.finishSession();
                    return;
                }
                this.currentWord = remaining[Math.floor(Math.random() * remaining.length)];
                this.spellingAttempt = 0;
                this.userSpelling = '';
                this.generateHint();
                
                this.$nextTick(() => {
                    if(this.$refs.spellInput) this.$refs.spellInput.focus();
                });
            },
            generateHint() {
                if(!this.currentWord) return;
                const word = this.currentWord.word;
                const len = word.length;
                
                if (len <= 3 || Math.random() < 0.3) {
                    this.currentHint = "_ ".repeat(len);
                    return;
                }
                
                const numReveal = Math.floor(Math.random() * (len / 2)) + 1;
                let indices = new Set();
                while(indices.size < numReveal) {
                    indices.add(Math.floor(Math.random() * len));
                }
                
                let hint = "";
                for(let i=0; i<len; i++) {
                    hint += indices.has(i) ? word[i] + " " : "_ ";
                }
                this.currentHint = hint;
            },
            async submitSpelling() {
                if(!this.userSpelling) return;
                
                if(this.userSpelling.trim().toLowerCase() === this.currentWord.word.toLowerCase()) {
                    // Correct
                    if(this.spellingAttempt === 0) {
                        this.progressMap[this.currentWord.id] = 2; 
                    } else {
                        this.progressMap[this.currentWord.id]++;
                    }
                    
                    await fetch('/api/update_progress', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ word_id: this.currentWord.id, success: true })
                    });

                    this.nextSpellingWord();
                } else {
                    alert(`Not quite! The answer is: ${this.currentWord.word}`);
                    this.spellingAttempt++;
                    this.progressMap[this.currentWord.id] = 0;
                    this.userSpelling = '';
                    // 重新生成提示，降低难度？这里暂时保持原样
                }
            },
            finishSession() {
                this.page = 'finished';
            }
        }
    });

    // 关键修复：挂载应用到 #app 元素
    app.mount('#app');
</script>
</body>
</html>
